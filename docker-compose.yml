# 단일 서버 배포 구성: Nginx(HTTPS) → Spring Boot 앱 → PostgreSQL
# 사용법: cp .env.example .env && (값 채우기) && docker compose up -d --build
services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  app:
    build: .
    image: compassion/gift-wrap-game:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      GAME_ADMIN_USERNAME: ${GAME_ADMIN_USERNAME:-}
      GAME_ADMIN_PASSWORD_HASH: ${GAME_ADMIN_PASSWORD_HASH:-}
      FORWARD_HEADERS_STRATEGY: NATIVE
      DDL_AUTO: ${DDL_AUTO:-update}
    # 외부에 포트를 열지 않음 (Nginx 를 통해서만 접근)
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

volumes:
  db-data:
  certbot-www:

networks:
  frontend:
  backend:
    internal: true
