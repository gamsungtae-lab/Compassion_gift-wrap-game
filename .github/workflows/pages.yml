# GitHub Pages 배포: main 브랜치에 push 하면 게임 화면(정적 파일)을 자동 공개한다.
# 저장소 Settings > Secrets and variables > Actions > Variables 에 SHEETS_URL(Apps Script 웹 앱 주소)을 등록한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          SHEETS_URL: ${{ vars.SHEETS_URL }}
        run: bash scripts/build-static.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
